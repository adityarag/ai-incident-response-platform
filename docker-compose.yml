# ============================================================
# AI Incident Response Platform — Docker Compose
# ============================================================
# Phase 1: API Gateway + PostgreSQL
#
# Usage:
#   docker compose up --build
#   docker compose down -v   (removes volumes too)
# ============================================================

services:
  # ── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-incident_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - platform-net

  # ── Database Migrations ──────────────────────────────────
  migrations:
    build:
      context: .
      dockerfile: database/Dockerfile
    container_name: platform-migrations
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-incident_platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform-net

  # ── API Gateway ──────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: platform-api-gateway
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-incident_platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      ORDER_SERVICE_URL: http://order-service:8001
      PAYMENT_SERVICE_URL: http://payment-service:8002
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - platform-net

  # ── Order Service ─────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: platform-order-service
    environment:
      ORDER_POSTGRES_HOST: postgres
      ORDER_POSTGRES_PORT: 5432
      ORDER_POSTGRES_DB: ${POSTGRES_DB:-incident_platform}
      ORDER_POSTGRES_USER: ${POSTGRES_USER:-platform}
      ORDER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      ORDER_PAYMENT_SERVICE_URL: http://payment-service:8002
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      payment-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - platform-net

  # ── Payment Service ───────────────────────────────────────
  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: platform-payment-service
    environment:
      PAYMENT_POSTGRES_HOST: postgres
      PAYMENT_POSTGRES_PORT: 5432
      PAYMENT_POSTGRES_DB: ${POSTGRES_DB:-incident_platform}
      PAYMENT_POSTGRES_USER: ${POSTGRES_USER:-platform}
      PAYMENT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - platform-net

volumes:
  postgres_data:
    driver: local

networks:
  platform-net:
    driver: bridge
