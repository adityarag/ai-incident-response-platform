apiVersion: batch/v1
kind: Job
metadata:
  name: platform-migrations
  namespace: incident-platform
  labels:
    app: platform-migrations
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: platform-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: platform-migrations:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
