name: Docker Container Build Check

"on":
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: false
          tags: platform-api-gateway:latest

      - name: Build Order Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/order-service/Dockerfile
          push: false
          tags: platform-order-service:latest

      - name: Build Payment Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/payment-service/Dockerfile
          push: false
          tags: platform-payment-service:latest

      - name: Build Migrations Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: database/Dockerfile
          push: false
          tags: platform-migrations:latest
