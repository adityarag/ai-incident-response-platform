name: Kubernetes Manifests Validation

"on":
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Install Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Manifests (Schema Validation)
        run: |
          echo "Validating Kubernetes manifests with Kubeconform..."
          for manifest in k8s/*.yaml; do
            if [ "$(basename "$manifest")" != "kustomization.yaml" ]; then
              echo "Validating $manifest..."
              kubeconform -summary -strict "$manifest"
            fi
          done

      - name: Validate Kustomize Build & Output
        run: |
          echo "Building Kustomize manifests and validating compiled output..."
          kubectl kustomize k8s/ | kubeconform -summary -strict
          echo "Kustomize build and schema validation succeeded."
